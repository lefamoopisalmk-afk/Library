# Render Blueprint: one web service (Express serving the API and the built
# React app) plus one PostgreSQL database. Deploy it from the Render dashboard
# with "New > Blueprint" and this repository.
services:
  - type: web
    name: brew-and-bind
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: brew-and-bind-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_VIEW_KEY
        generateValue: true
      # Asked for when you deploy: the secret code staff enter at sign-in.
      - key: STAFF_SIGNIN_CODE
        sync: false

databases:
  - name: brew-and-bind-db
    plan: free
    databaseName: library
    user: library
